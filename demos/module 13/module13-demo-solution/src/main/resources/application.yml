server:
  port: 8080

spring:
  application:
    name: taskflow-api
  # Module 9: Keycloak is expected to be running locally (see
  # docker-compose.yml) with a realm called "taskflow" already set up.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/taskflow
  # Module 13: an in-memory database, purely for this module's demos.
  datasource:
    url: jdbc:h2:mem:taskflow
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    # Without this, data.sql tries to run before Hibernate creates the
    # schema from Account, and every insert fails at startup.
    defer-datasource-initialization: true

# Module 13, Security Misconfiguration: locked down. Only "health" is
# exposed now — no environment variables, no internal bean names, no
# heap dumps reachable over HTTP. This is the fix; the starter had
# include: "*" here instead.
management:
  endpoints:
    web:
      exposure:
        include: health

# Module 5's lockout threshold lived here. Retired as of Module 9 —
# Keycloak now owns login attempts, lockout policy, and password storage
# entirely. Left commented rather than deleted, so the history is visible.
# security:
#   lockout:
#     max-attempts: 5

logging:
  level:
    root: INFO
    com.taskflow: INFO
    org.springframework.security: INFO


