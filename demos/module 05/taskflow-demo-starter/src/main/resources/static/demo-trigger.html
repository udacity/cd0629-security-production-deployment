<!DOCTYPE html>
<html>
<head>
  <title>TaskFlow Demo Trigger</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 0 20px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    pre {
      background-color: #f5f5f5;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 16px;
      margin-top: 20px;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <h1>TaskFlow Demo Trigger</h1>
  <button id="create-btn">Create Task</button>
  <pre id="result"></pre>

  <script>
    document.getElementById('create-btn').addEventListener('click', async () => {
      const resultEl = document.getElementById('result');
      resultEl.textContent = 'Sending...';
      try {
        const response = await fetch('/api/v1/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: 'Demo task' })
        });
        const body = await response.json().catch(() => null);
        resultEl.textContent = 'Status: ' + response.status + '\n' + JSON.stringify(body, null, 2);
      } catch (err) {
        resultEl.textContent = 'Request failed: ' + err;
      }
    });
  </script>
</body>
</html>
