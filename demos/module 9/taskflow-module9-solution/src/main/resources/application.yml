server:
  port: 8080

spring:
  application:
    name: taskflow-api
  # Module 9: Keycloak is expected to be running locally (see
  # docker-compose.yml) with a realm called "taskflow" already set up.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/taskflow
logging:
  level:
    root: INFO
    com.taskflow: INFO
    org.springframework.security: INFO

