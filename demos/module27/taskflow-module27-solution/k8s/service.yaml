# Module 27: ClusterIP, matching Module 26's exact framing — internal
# only, no path in from outside the cluster on its own. This gives the
# two shifting, replaceable Pods from deployment.yaml one stable
# address that never changes, load-balancing across whichever Pods are
# currently healthy.
#
# To actually reach this from outside the cluster for testing, use
# kubectl port-forward rather than NodePort — simpler, no extra host
# networking to configure, and it's the standard way a developer
# reaches into a cluster locally. NodePort and LoadBalancer exist and
# matter in real deployments (see Module 26), just not needed for this
# specific test.
apiVersion: v1
kind: Service
metadata:
  name: taskflow-service
spec:
  type: ClusterIP
  selector:
    app: taskflow-api
  ports:
    - port: 8080
      targetPort: 8080
