server:
  port: 8080

spring:
  application:
    name: taskflow-api
  # Module 9: Keycloak is expected to be running locally (see
  # docker-compose.yml) with a realm called "taskflow" already set up.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/taskflow
  # Module 13: an in-memory database, purely for this module's demos.
  datasource:
    url: jdbc:h2:mem:taskflow
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    # Without this, data.sql tries to run before Hibernate creates the
    # schema from Account, and every insert fails at startup.
    defer-datasource-initialization: true
  # Module 15 solution: no hardcoded secret here anymore. spring.config.import
  # tells Spring Boot to also pull configuration from Vault at startup,
  # before the rest of the app initializes — exactly the bootstrap-phase
  # ordering Module 14 described. The partner.api-key property below now
  # comes from Vault, not this file; PartnerApiKeyProperties never changes.
  #
  # Worth noting honestly: the Vault token below is a real dev-mode
  # simplification, not something to ship. A production setup would use a
  # real Vault auth method (AppRole, Kubernetes service account auth, cloud
  # IAM auth) instead of a static root token — Module 14 didn't cover that,
  # it's out of scope here, but don't take this ${VAULT_TOKEN} pattern as
  # "solved," it just moved the token one level out, the same way the
  # dependency-check NVD key did in Module 13.
  config:
    import: "vault://"
  cloud:
    vault:
      uri: http://localhost:8200
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: secret
        default-context: taskflow

# Module 13, Security Misconfiguration: locked down. Only "health" is
# exposed now — no environment variables, no internal bean names, no
# heap dumps reachable over HTTP. This is the fix; the starter had
# include: "*" here instead.
management:
  endpoints:
    web:
      exposure:
        include: health

# Module 5's lockout threshold lived here. Retired as of Module 9 —
# Keycloak now owns login attempts, lockout policy, and password storage
# entirely. Left commented rather than deleted, so the history is visible.
# security:
#   lockout:
#     max-attempts: 5

logging:
  level:
    root: INFO
    com.taskflow: INFO
    org.springframework.security: INFO