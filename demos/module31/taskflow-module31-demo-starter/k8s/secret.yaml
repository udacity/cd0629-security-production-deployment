# Module 27: matching Module 26's exact db-password example — sensitive
# data, injected as an environment variable only when the Pod starts.
#
# Kubernetes Secrets are base64-ENCODED here, not encrypted — worth
# being precise about that distinction on camera. Anyone with read
# access to Secrets in this namespace can trivially decode this value
# (`echo <value> | base64 -d`). Real encryption at rest is a cluster-
# level configuration (etcd encryption), separate from this file
# format. Don't let "base64" read as "secure."
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secret
type: Opaque
data:
  VAULT_TOKEN: dGFza2Zsb3ctcm9vdC10b2tlbg==
