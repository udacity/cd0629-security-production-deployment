<!DOCTYPE html>
<html>
<head>
  <title>TaskFlow Frontend (localhost:3000)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 0 20px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .origin-badge {
      display: inline-block;
      background-color: #f0f0f0;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      font-family: monospace;
      margin-bottom: 24px;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    pre {
      background-color: #f5f5f5;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 16px;
      margin-top: 20px;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <h1>TaskFlow Frontend</h1>
  <div class="origin-badge">running on http://localhost:3000</div>
  <p>This page is served from a different origin than the TaskFlow API
  (http://localhost:8080). Clicking the button below makes a genuine
  cross-origin request — this is what CORS actually governs.</p>

  <button id="fetch-btn">Fetch Tasks from localhost:8080</button>
  <pre id="result"></pre>

  <script>
    document.getElementById('fetch-btn').addEventListener('click', async () => {
      const resultEl = document.getElementById('result');
      resultEl.textContent = 'Sending cross-origin request...';
      try {
        const response = await fetch('http://localhost:8080/api/v1/tasks');
        const body = await response.json();
        resultEl.textContent = 'Status: ' + response.status + '\n' + JSON.stringify(body, null, 2);
      } catch (err) {
        // A CORS block surfaces here as a generic network error, not a
        // readable status code — the browser refuses to even expose the
        // response to this script. Check the browser console for the
        // real CORS error message.
        resultEl.textContent = 'Request failed (check the browser console for the CORS error): ' + err;
      }
    });
  </script>
</body>
</html>
