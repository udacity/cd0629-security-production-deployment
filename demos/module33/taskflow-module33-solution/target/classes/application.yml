server:
  port: 8080

spring:
  application:
    name: taskflow-api
  # Module 9: Keycloak is expected to be running locally (see
  # docker-compose.yml) with a realm called "taskflow" already set up.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/taskflow
  # Module 13: an in-memory database, purely for this module's demos.
  datasource:
    url: jdbc:h2:mem:taskflow
    driver-class-name: org.h2.Driver
    username: sa
    password:
    # Module 33: made explicit rather than left at HikariCP's default
    # (also 10, coincidentally) — Module 32's virtual threads warning
    # only makes sense once this number is something you can actually
    # point at. However many concurrent requests this app appears to
    # handle, only this many database queries can run at once.
    hikari:
      maximum-pool-size: 10
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      # Module 31: Flyway now owns the schema — validate just confirms
      # the Account entity actually matches what Flyway created,
      # instead of Hibernate generating (and dropping) it on its own.
      # create-drop and Flyway together would fight over who's in
      # charge of the schema; only one gets to own it.
      ddl-auto: validate
  # Module 15 solution: no hardcoded secret here anymore. Module 17 adds
  # a second import alongside it, for non-secret config from a real
  # Config Server. "optional:" on the configserver entry means TaskFlow
  # still starts even if the Config Server happens to be down — a
  # deliberate resilience choice for local dev, not something to lean on
  # in production. Vault stays required (no "optional:"), since the app
  # genuinely can't function correctly without its API key.
  #
  # Worth noting honestly: the Vault token below is a real dev-mode
  # simplification, not something to ship. A production setup would use a
  # real Vault auth method (AppRole, Kubernetes service account auth, cloud
  # IAM auth) instead of a static root token — Module 14 didn't cover that,
  # it's out of scope here, but don't take this ${VAULT_TOKEN} pattern as
  # "solved," it just moved the token one level out, the same way the
  # dependency-check NVD key did in Module 13.
  config:
    import: "vault://,optional:configserver:http://localhost:8888"
  cloud:
    vault:
      uri: http://localhost:8200
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: secret
        default-context: taskflow

# Module 13, Security Misconfiguration: locked down. Only "health" is
# exposed by default. Module 17 adds "refresh" specifically, needed to
# trigger @RefreshScope beans to reload without a restart — a deliberate,
# narrow re-opening, not a return to the wide-open starter state.
# Module 23 adds "prometheus", formatted metrics for Prometheus to
# scrape. Also enabling percentile histograms specifically for
# http.server.requests — Module 22's point about averages lying to you,
# this is what actually lets Prometheus calculate a real p99 later,
# instead of one misleading flat number. And health probes, so this app
# exposes separate liveness (is the process alive) and readiness (can
# it actually serve traffic right now) signals, matching Module 22's
# warning not to confuse the two.
management:
  endpoints:
    web:
      exposure:
        include: health,refresh,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      probes:
        enabled: true

# Module 5's lockout threshold lived here. Retired as of Module 9 —
# Keycloak now owns login attempts, lockout policy, and password storage
# entirely. Left commented rather than deleted, so the history is visible.
# security:
#   lockout:
#     max-attempts: 5

logging:
  level:
    root: INFO
    com.taskflow: INFO
    org.springframework.security: INFO
    # Module 33: prints every SQL statement Hibernate actually sends,
    # in order. This is the real, visible proof for the N+1 demo —
    # count how many SELECT statements print for the vulnerable
    # endpoint versus the fixed one.
    org.hibernate.SQL: DEBUG
  # Module 19: native Spring Boot structured logging, no extra
  # dependency needed. ecs = Elastic Common Schema, the same format
  # Module 18 named as the one that lets a Java service's logs match a
  # Go or Node service's logs, key for key. MDC values (like traceId
  # from CorrelationIdFilter) are included in this JSON automatically.
  structured:
    format:
      console: ecs
      file: ecs
  # Module 21: same structured JSON, also written to a real file, since
  # that's what actually gets shipped to a centralized system. Console
  # output alone disappears the moment this terminal closes.
  file:
    name: logs/taskflow.log
