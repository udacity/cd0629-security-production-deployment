# Module 31: "Green" — the new version, deployed alongside Blue,
# completely isolated from it. Both run at the same time; nothing about
# creating this Deployment affects Blue's traffic at all. The cutover
# only happens later, when the Service's selector changes.
#
# Same image, rebuilt and re-tagged as v2 for this demo — the point
# here is proving the Kubernetes traffic-switching mechanism works,
# not that this specific rebuild contains a meaningfully different
# app. A real Green deployment would carry actual code changes; this
# one exists to make "two distinct, real image references" testable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-api-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow-api
      version: green
  template:
    metadata:
      labels:
        app: taskflow-api
        version: green
    spec:
      containers:
        - name: taskflow-api
          image: taskflow-api:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: taskflow-config
            - secretRef:
                name: taskflow-secret
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
