services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      # Host 8081 -> container 8080, so it doesn't collide with
      # TaskFlow's own port 8080.
      - "8081:8080"

  # Module 15: dev-mode Vault, the same "not for production" convenience
  # as Keycloak's start-dev — in-memory, auto-unsealed, a fixed root
  # token instead of a real unseal process.
  vault:
    image: hashicorp/vault:1.18
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: taskflow-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"

  # Module 21: single-node, security disabled — same "not for
  # production" convenience as everything else in this file. Heap
  # capped at 512MB on purpose; this is a demo with a handful of log
  # lines, not a real cluster, and an uncapped heap is the most common
  # reason Elasticsearch crashes locally (exit code 137 = out of memory).
  # Before starting this, confirm Docker Desktop has at least 4GB of
  # memory allocated overall (Settings -> Resources).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.4
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  # Module 23: TaskFlow itself runs natively (mvn spring-boot:run), not
  # in this Docker network — host.docker.internal in prometheus.yml is
  # what lets this container reach out to the host machine to scrape
  # it. That hostname resolves reliably on Docker Desktop (Mac/Windows);
  # on native Linux Docker it sometimes needs an explicit
  # extra_hosts entry, added below just in case.
  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.yml:/etc/prometheus/alerts.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      # Host 3001 -> container 3000. Grafana's own default port is
      # 3000, deliberately mapped to 3001 here instead, since that's
      # the same port Module 11's cors-frontend runs on
      # (python3 -m http.server 3000) — avoids a collision if both are
      # ever running at once.
      - "3001:3000"
    depends_on:
      - prometheus

  # Module 25: TaskFlow itself, containerized. Deliberately OPT-IN via
  # the "containerized" profile — every module before this one assumed
  # TaskFlow runs natively (mvn spring-boot:run), and plain
  # `docker compose up -d` should keep working exactly like it always
  # has. To include this service: `docker compose --profile
  # containerized up -d`.
  #
  # Real gotcha, worth knowing rather than being surprised by: Keycloak
  # and Vault are reached here by their DOCKER SERVICE NAMES
  # (keycloak:8080, vault:8200) — not localhost, and not the host-mapped
  # ports (8081, 8200) every other module has used. Once TaskFlow itself
  # is inside this network, "localhost" means the container itself, not
  # the host machine or its sibling containers.
  #
  # A second, real limitation, not solved here: a JWT obtained via
  # Keycloak's HOST-facing URL (localhost:8081) has an "iss" claim of
  # http://localhost:8081/realms/taskflow — which will NOT match this
  # container's issuer-uri (http://keycloak:8080/realms/taskflow).
  # That's a genuine, common Docker+Keycloak mismatch, not a bug in this
  # setup — properly solving it means configuring Keycloak's hostname
  # settings explicitly, outside this module's scope. Test this
  # container with permitAll endpoints, not a full authenticated flow.
  taskflow-api:
    build: .
    profiles: ["containerized"]
    ports:
      - "8080:8080"
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/taskflow
      SPRING_CLOUD_VAULT_URI: http://vault:8200
      VAULT_TOKEN: taskflow-root-token
    depends_on:
      - keycloak
      - vault

  # Module 29: also opt-in, same reasoning as taskflow-api above — this
  # is a heavier piece of infrastructure, no reason to start it with a
  # plain `docker compose up -d`.
  #
  # /var/run/docker.sock is mounted so the CONTROLLER can spin up
  # ephemeral build-agent containers (via the docker-workflow plugin)
  # and run the final "docker build" stage directly. This is the
  # standard "Docker-outside-of-Docker" pattern — worth naming
  # explicitly: it gives this container root-equivalent access to the
  # host's Docker daemon. Fine for a local, throwaway CI demo; a real
  # production Jenkins setup would use a more locked-down agent model.
  #
  # ./:/taskflow-source mounts this ENTIRE project, including its real
  # .git history, so Jenkins can check it out via a real
  # file:///taskflow-source SCM URL — the same mechanism as checking
  # out from a real GitHub URL, just pointed at a local path instead of
  # a network one.
  jenkins:
    build: ./jenkins
    profiles: ["containerized"]
    ports:
      - "8082:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/taskflow-source:ro

volumes:
  jenkins_home:
