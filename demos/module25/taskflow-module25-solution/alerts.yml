# Module 22/23: a real, concrete version of the "9 second threshold"
# example from Module 22's slide — a quality failure defined explicitly
# in configuration, not left as an implicit guess. This is the SLI/SLO
# concept made tangible: not built as a full alerting pipeline (no
# Slack/PagerDuty wiring here), but a real rule Prometheus actually
# evaluates.
groups:
  - name: taskflow-latency
    rules:
      - alert: PartnerFetchTooSlow
        expr: histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{uri="/api/v1/partners/fetch"}[5m])) by (le)) > 9
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Partner fetch p99 latency exceeds the 9 second quality threshold"
