services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      # Host 8081 -> container 8080, so it doesn't collide with
      # TaskFlow's own port 8080.
      - "8081:8080"

  # Module 15: dev-mode Vault, the same "not for production" convenience
  # as Keycloak's start-dev — in-memory, auto-unsealed, a fixed root
  # token instead of a real unseal process.
  vault:
    image: hashicorp/vault:1.18
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: taskflow-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
