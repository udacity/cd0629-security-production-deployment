name: udabank-orderservice

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=orderservice
      - POSTGRES_USER=orderservice
      - POSTGRES_PASSWORD=orderservice
    ports:
      - "5433:5432" # host 5433 to dodge a local Postgres already on 5432; app connects via the internal 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderservice"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventoryservice:
    build: ./inventoryservice
    ports:
      - "8082:8082"

  orderservice:
    build: ./orderservice
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - INVENTORY_BASE_URL=http://inventoryservice:8082
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inventoryservice:
        condition: service_started
