apiVersion: v1
kind: Secret
metadata:
  name: orderservice-db-credentials
type: Opaque
# stringData lets you write plaintext here and the API server base64-encodes
# it on creation — much easier to read/maintain than hand-computing base64
# yourself. Important to be clear-eyed about what this actually buys you:
# base64 is an ENCODING, not encryption. Anyone with `kubectl get secret -o
# yaml` access (or etcd access, by default) can trivially decode this. Real
# protection needs encryption-at-rest configured on the cluster (KMS
# provider) or an external secret store — see module 7 (Vault) for the
# "actual secret management" version of this problem; this exercise is
# specifically about the Kubernetes-native mechanism, warts and all.
stringData:
  DB_USER: orderservice
  DB_PASSWORD: orderservice
