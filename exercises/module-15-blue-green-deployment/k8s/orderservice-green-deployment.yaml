apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderservice-green
  labels:
    app: orderservice
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orderservice
      version: green
  template:
    metadata:
      labels:
        app: orderservice
        version: green
    spec:
      containers:
        - name: orderservice
          image: udabank/orderservice:green
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: orderservice-config
            - secretRef:
                name: orderservice-db-credentials
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
