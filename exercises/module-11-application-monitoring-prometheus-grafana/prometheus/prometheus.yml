global:
  scrape_interval: 5s

scrape_configs:
  - job_name: orderservice
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["orderservice:8081"]

  - job_name: inventoryservice
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["inventoryservice:8082"]

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
